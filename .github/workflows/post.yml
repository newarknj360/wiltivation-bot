name: Wiltivation Auto-Post

on:
  schedule:
    # 12:00 UTC = 7:00am CDT / 8:00am CST -- adjust for your timezone & DST.
    # cron does NOT auto-adjust for daylight saving; revisit twice a year.
    - cron: '0 12 * * 1,3,5'   # Mon / Wed / Fri
  workflow_dispatch: {}         # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the generated images back

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install fonts + dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu fonts-noto-core
          # Poppins & Lora aren't in apt; fetch them directly from Google Fonts' GitHub repo
          mkdir -p ~/.fonts
          curl -sL -o ~/.fonts/Poppins-Bold.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-Bold.ttf
          curl -sL -o ~/.fonts/Poppins-Light.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-Light.ttf
          curl -sL -o ~/.fonts/Poppins-Medium.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-Medium.ttf
          curl -sL -o ~/.fonts/Lora-Italic-Variable.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/lora/Lora-Italic%5Bwght%5D.ttf
          fc-cache -f
          pip install -r requirements.txt

      - name: Run pipeline
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python pipeline.py
